name: Build & Publish Windows Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag for GitHub Release (e.g., v1.0.2)'
        required: false
        default: 'v1.0.2'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-windows:
    name: Windows 10/11 Release (x64 Standalone + Portable)
    runs-on: windows-latest
    env:
      NODE_RUNTIME_VERSION: '22.14.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript check
        run: npm run lint

      - name: Build Portable Windows Release (.zip)
        run: npm run release:windows

      - name: Bundle Standalone Zero-Dependency Windows x64 Release (with embedded node.exe)
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $ver = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $dispatchTag = "${{ github.event.inputs.release_tag }}"
          $refType = "${{ github.ref_type }}"
          $refName = "${{ github.ref_name }}"

          if ($dispatchTag -and $dispatchTag.Trim().Length -gt 0) {
            $resolvedTag = $dispatchTag.Trim()
          } elseif ($refType -eq "tag" -and $refName.StartsWith("v")) {
            $resolvedTag = $refName
          } else {
            $resolvedTag = "v$ver"
          }

          "release_tag=$resolvedTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $nodeVer = $env:NODE_RUNTIME_VERSION
          $nodeZipUrl = "https://nodejs.org/dist/v$nodeVer/node-v$nodeVer-win-x64.zip"
          $tempZipPath = Join-Path $env:RUNNER_TEMP "node-win-x64.zip"
          $tempExtractDir = Join-Path $env:RUNNER_TEMP "node-extracted"

          Write-Host "Downloading official Node.js v$nodeVer Windows x64 runtime..."
          Invoke-WebRequest -Uri $nodeZipUrl -OutFile $tempZipPath -UseBasicParsing
          Expand-Archive -Path $tempZipPath -DestinationPath $tempExtractDir -Force

          $standaloneStage = "release\LedgerPulse-Windows-x64-Standalone"
          Copy-Item -Path "release\LedgerPulse-Windows" -Destination $standaloneStage -Recurse -Force
          New-Item -ItemType Directory -Path "$standaloneStage\runtime" -Force | Out-Null

          $extractedNodeExe = Join-Path $tempExtractDir "node-v$nodeVer-win-x64\node.exe"
          Copy-Item -Path $extractedNodeExe -Destination "$standaloneStage\runtime\node.exe" -Force

          $standaloneZip = "release\LedgerPulse-Windows-x64-Standalone-$resolvedTag.zip"
          Compress-Archive -Path $standaloneStage -DestinationPath $standaloneZip -CompressionLevel Optimal -Force

          # Generate SHA256SUMS.txt
          $hashes = Get-ChildItem "release\*.zip" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Set-Content -Path "release\SHA256SUMS.txt" -Encoding UTF8

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LedgerPulse-Windows-Releases
          path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: LedgerPulse for Windows (${{ steps.meta.outputs.release_tag }})
          make_latest: true
          generate_release_notes: true
          body: |
            ## LedgerPulse for Windows 10 / 11 (${{ steps.meta.outputs.release_tag }})

            ### Which file should I download?
            - **`LedgerPulse-Windows-x64-Standalone-${{ steps.meta.outputs.release_tag }}.zip` (Recommended — Zero Prerequisites)**: Includes an embedded Windows x64 runtime (`runtime\node.exe`). Unzip anywhere and double-click **`Install-Windows-App.bat`** to add Desktop & Start Menu shortcuts and launch silently in a native desktop app window.
            - **`LedgerPulse-Windows-${{ steps.meta.outputs.release_tag }}.zip` (Lightweight Portable)**: Pre-bundled server + PWA client (~3 MB, zero `npm install` needed; uses an existing Node.js 20+ installation).

            ### Highlights
            - **Bank & Credit Card CSV Statement Importer (`Import CSV`)**: Instant, offline-capable `.csv` / `.tsv` importer with auto-column detection (`Date`, `Merchant`/`Description`, single `Amount` or split `Debit` + `Credit`, `Category`, `Card/Account`), sign-convention selector, inline category override, per-row selection, and cross-source duplicate reconciliation
            - **100% Production-Clean Workspace**: Removed all demo datasets, preset sample buttons, and synthetic test generators across the application and server
            - **Gmail OAuth (`gmail.readonly`) & Multi-Device Sync on Windows**: Automatic Cloud+Gmail desktop launch when online with local vault fallback and built-in offline parser when disconnected
            - **Streamlined 5-Tab Workspace**: Overview, Transactions & Subscriptions (with Automated Subscription Watchdog), Reports, Savings Goals (editable balances + Undo delete), and Split Bills
          files: |
            release/*.zip
            release/SHA256SUMS.txt
