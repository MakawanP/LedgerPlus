<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="meta-theme-color" content="#f8fafc" />
    <meta name="application-name" content="LedgerPulse" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>LedgerPulse Personal Finance Tracker</title>
    <meta name="description" content="Local-first Windows personal AI finance and spending tracker with local disk storage and automated notification & receipt ingestion." />
    <meta property="og:title" content="LedgerPulse Personal Finance Tracker" />
    <meta property="og:description" content="Local-first Windows personal AI finance and spending tracker with local disk storage and automated notification & receipt ingestion." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ledgerpulse_theme');
          var isDark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var themeMeta = document.getElementById('meta-theme-color');
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (themeMeta) themeMeta.setAttribute('content', '#020617');
          } else {
            document.documentElement.classList.remove('dark');
            if (themeMeta) themeMeta.setAttribute('content', '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-slate-900 selection:text-white dark:selection:bg-slate-100 dark:selection:text-slate-900 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
